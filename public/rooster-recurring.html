<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐓 Rooster Recurring</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--teal:#00897B;--teal-dark:#004D40;--teal-light:#E0F2F1;--amber:#E65100;--amber-mid:#FF8F00;--bg:#0D1F1C;--surface:#132420;--surface2:#1A2F2B;--border:#1F3D38;--text:#E8F5F3;--muted:#7BA09A;--green:#4CAF50;--green-bg:rgba(76,175,80,0.12);--red:#EF5350;--red-bg:rgba(239,83,80,0.12);--yellow:#FFB300;--yellow-bg:rgba(255,179,0,0.12);--font:'Syne',sans-serif;--mono:'DM Mono',monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;}
  header{background:linear-gradient(135deg,var(--teal-dark) 0%,#006055 60%,var(--amber) 160%);padding:24px 32px 20px;border-bottom:2px solid var(--teal);display:flex;align-items:center;justify-content:space-between;}
  .hl{display:flex;align-items:center;gap:16px;}
  header h1{font-size:1.4rem;font-weight:800;letter-spacing:-0.02em;}
  header h1 span{color:var(--amber-mid);}
  .tagline{font-family:var(--mono);font-size:0.7rem;color:var(--teal-light);opacity:0.7;margin-top:3px;}
  .sync{font-family:var(--mono);font-size:0.72rem;padding:5px 12px;border-radius:20px;background:rgba(0,0,0,0.3);}
  .sync.ok{color:var(--green);}.sync.busy{color:var(--yellow);}.sync.err{color:var(--red);}
  .container{max-width:860px;margin:0 auto;padding:0 20px;}
  .summary{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 24px;margin:24px 0 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .si{display:flex;flex-direction:column;gap:4px;}
  .si label{font-family:var(--mono);font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;}
  .si .val{font-size:1.6rem;font-weight:800;letter-spacing:-0.02em;}
  .val.red{color:var(--red);}.val.yellow{color:var(--yellow);}.val.green{color:var(--green);}
  .af{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px;display:grid;grid-template-columns:1fr 120px 130px 110px auto;gap:10px;align-items:end;}
  .fg{display:flex;flex-direction:column;gap:5px;}
  .fg label{font-size:0.68rem;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;}
  .fg input,.fg select{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:0.9rem;padding:9px 12px;outline:none;transition:border-color 0.2s;width:100%;}
  .fg input:focus,.fg select:focus{border-color:var(--teal);}
  .btn-add{background:var(--amber);border:none;border-radius:8px;color:white;font-family:var(--font);font-size:0.9rem;font-weight:700;padding:10px 20px;cursor:pointer;white-space:nowrap;transition:background 0.2s,transform 0.1s;}
  .btn-add:hover{background:var(--amber-mid);}.btn-add:active{transform:scale(0.97);}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .tab{padding:7px 16px;border-radius:8px;font-size:0.8rem;font-weight:700;cursor:pointer;border:1.5px solid transparent;background:var(--surface);color:var(--muted);transition:all 0.2s;}
  .tab.active,.tab:hover{background:var(--teal-dark);border-color:var(--teal);color:var(--teal-light);}
  .lh{display:grid;grid-template-columns:1fr 100px 120px 90px 36px;gap:10px;padding:8px 16px;font-family:var(--mono);font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;}
  .rl{display:flex;flex-direction:column;gap:6px;}
  .ri{background:var(--surface);border:1px solid var(--border);border-radius:10px;display:grid;grid-template-columns:1fr 100px 120px 90px 36px;gap:10px;padding:12px 16px;align-items:center;transition:border-color 0.2s;animation:fi 0.2s ease;}
  @keyframes fi{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .ri:hover{border-color:var(--teal);}
  .rn{font-size:0.92rem;font-weight:600;}
  .rf{font-family:var(--mono);font-size:0.72rem;padding:3px 10px;border-radius:20px;width:fit-content;}
  .fM{background:var(--green-bg);color:var(--green);}
  .fW{background:var(--yellow-bg);color:var(--yellow);}
  .fB{background:rgba(0,137,123,0.15);color:var(--teal);}
  .fQ{background:rgba(255,143,0,0.15);color:var(--amber-mid);}
  .fA{background:var(--red-bg);color:var(--red);}
  .rd2{font-family:var(--mono);font-size:0.82rem;color:var(--muted);}
  .rd2.urgent{color:var(--red);font-weight:500;}.rd2.soon{color:var(--yellow);font-weight:500;}
  .ra{font-family:var(--mono);font-size:0.95rem;font-weight:500;text-align:right;color:var(--red);}
  .bd{background:none;border:none;color:var(--border);cursor:pointer;font-size:1rem;padding:4px;border-radius:4px;transition:color 0.2s;}
  .bd:hover{color:var(--red);}
  .empty{text-align:center;padding:48px 24px;color:var(--muted);font-family:var(--mono);font-size:0.85rem;}
  .db{background:var(--red-bg);border:1px solid var(--red);border-radius:12px;padding:14px 18px;margin-bottom:16px;display:none;}
  .db.on{display:block;}
  .db h3{font-size:0.85rem;color:var(--red);margin-bottom:8px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.06em;}
  .db ul{list-style:none;display:flex;flex-direction:column;gap:4px;}
  .db li{font-size:0.85rem;display:flex;justify-content:space-between;gap:20px;}
  .db li span{font-family:var(--mono);color:var(--red);}
</style>
</head>
<body>
<header>
  <div class="hl">
    <div style="font-size:2rem">🐓</div>
    <div><h1>ROOSTER <span>RECURRING</span></h1><div class="tagline">Fixed expenses · Due dates · Cloud synced</div></div>
  </div>
  <div class="sync busy" id="ss">⟳ Connecting...</div>
</header>
<div class="container">
  <div class="summary">
    <div class="si"><label>Total Monthly</label><div class="val red" id="sm">$0.00</div></div>
    <div class="si"><label>Due This Week</label><div class="val yellow" id="sw">$0.00</div></div>
    <div class="si"><label>Due Next 30 Days</label><div class="val green" id="s30">$0.00</div></div>
  </div>
  <div class="db" id="db"><h3>⚠️ Due Within 7 Days</h3><ul id="dl"></ul></div>
  <div class="af">
    <div class="fg"><label>Description</label><input type="text" id="fd" placeholder="e.g. Rent – 513 Greene St"></div>
    <div class="fg"><label>Amount</label><input type="number" id="fa" placeholder="2400.00" step="0.01" min="0"></div>
    <div class="fg"><label>Frequency</label><select id="ff" onchange="updateDueInput()"><option>Monthly</option><option>Weekly</option><option>Biweekly</option><option>Quarterly</option><option>Annual</option></select></div>
    <div class="fg"><label id="fdyl">Day of Month</label><div id="fdy-wrap"></div></div>
    <button class="btn-add" onclick="addItem()">+ Add</button>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="setFilter('All',this)">All</div>
    <div class="tab" onclick="setFilter('Monthly',this)">Monthly</div>
    <div class="tab" onclick="setFilter('Weekly',this)">Weekly</div>
    <div class="tab" onclick="setFilter('Biweekly',this)">Biweekly</div>
    <div class="tab" onclick="setFilter('Quarterly',this)">Quarterly</div>
    <div class="tab" onclick="setFilter('Annual',this)">Annual</div>
  </div>
  <div class="lh"><div>Description</div><div>Frequency</div><div>Next Due</div><div style="text-align:right">Amount</div><div></div></div>
  <div class="rl" id="rl"><div class="empty">Loading...</div></div>
</div>
<script>
const SU='https://snijtnaxdvuggqvsqatk.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuaWp0bmF4ZHZ1Z2dxdnNxYXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NTI0NjUsImV4cCI6MjA5MTMyODQ2NX0.9R7zv9_uVzsor2Fp8Ti49MBnCdLrxCWUTa5XBN4DcZs';
const H={'Content-Type':'application/json','apikey':SK,'Authorization':'Bearer '+SK,'Prefer':'return=representation'};
async function dbGet(t,p=''){const r=await fetch(`${SU}/rest/v1/${t}?${p}`,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json();}
async function dbIns(t,rows){const r=await fetch(`${SU}/rest/v1/${t}`,{method:'POST',headers:H,body:JSON.stringify(Array.isArray(rows)?rows:[rows])});if(!r.ok)throw new Error(await r.text());return r.json();}
async function dbDel(t,f){const r=await fetch(`${SU}/rest/v1/${t}?${f}`,{method:'DELETE',headers:H});if(!r.ok)throw new Error(await r.text());}
function ss(st,msg){const e=document.getElementById('ss');e.className='sync '+st;e.textContent=msg;}
let items=[],af='All';
function fmt(n){return'$'+Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function nextDue(item) {
  const today = new Date(); today.setHours(0,0,0,0);
  const day = item.day_num || 1;
  // Quarterly / Annual use a stored due_date and roll forward
  if ((item.freq === 'Quarterly' || item.freq === 'Annual') && item.due_date) {
    let d = new Date(item.due_date + 'T12:00:00');
    if (d <= today) {
      if (item.freq === 'Annual')    d.setFullYear(d.getFullYear() + 1);
      if (item.freq === 'Quarterly') d.setMonth(d.getMonth() + 3);
    }
    return d;
  }
  if (item.freq === 'Monthly') {
    let d = new Date(today.getFullYear(), today.getMonth(), day);
    if (d <= today) d = new Date(today.getFullYear(), today.getMonth() + 1, day);
    return d;
  }
  if (item.freq === 'Weekly') {
    let d = new Date(today);
    d.setDate(today.getDate() + ((day - today.getDay() + 7) % 7 || 7));
    return d;
  }
  if (item.freq === 'Biweekly') {
    let d = new Date(today);
    d.setDate(today.getDate() + ((day - today.getDay() + 14) % 14 || 14));
    return d;
  }
  return new Date(today.getFullYear(), today.getMonth(), day);
}
function daysUntil(d){const today=new Date();today.setHours(0,0,0,0);return Math.round((d-today)/86400000);}
function fmtDate(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function monthlyAmt(item){const m={Monthly:1,Weekly:4.33,Biweekly:2.17,Quarterly:1/3,Annual:1/12};return item.amt*(m[item.freq]||1);}
// Returns {day_num, due_date} depending on frequency
function getDueValue() {
  const freq = document.getElementById('ff').value;
  if (freq === 'Monthly') {
    return { day_num: parseInt(document.getElementById('fdy-num').value) || 1, due_date: null };
  }
  if (freq === 'Weekly' || freq === 'Biweekly') {
    return { day_num: parseInt(document.getElementById('fdy-dow').value), due_date: null };
  }
  // Quarterly / Annual — full date
  return { day_num: null, due_date: document.getElementById('fdy-date').value || null };
}

function updateDueInput() {
  const freq = document.getElementById('ff').value;
  const wrap = document.getElementById('fdy-wrap');
  const lbl  = document.getElementById('fdyl');
  const base = 'background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:0.9rem;padding:9px 12px;outline:none;width:100%;';
  if (freq === 'Monthly') {
    lbl.textContent = 'Day of Month';
    wrap.innerHTML = `<input type="number" id="fdy-num" placeholder="1" min="1" max="31" style="${base}">`;
  } else if (freq === 'Weekly' || freq === 'Biweekly') {
    lbl.textContent = 'Day of Week';
    wrap.innerHTML = `<select id="fdy-dow" style="${base}"><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option><option value="0">Sunday</option></select>`;
  } else {
    lbl.textContent = freq === 'Annual' ? 'Next Due Date' : 'Next Due Date';
    wrap.innerHTML = `<input type="date" id="fdy-date" style="${base};color-scheme:dark;">`;
  }
}

async function addItem() {
  const desc = document.getElementById('fd').value.trim();
  const amt  = parseFloat(document.getElementById('fa').value);
  const freq = document.getElementById('ff').value;
  const {day_num, due_date} = getDueValue();
  if (!desc || isNaN(amt) || amt <= 0) {
    document.getElementById('fd').style.borderColor = 'var(--red)';
    setTimeout(() => document.getElementById('fd').style.borderColor = '', 1200);
    return;
  }
  ss('busy','⟳ Saving...');
  try {
    const row = {id: Date.now(), description: desc, amt, freq, day_num: day_num||null, due_date: due_date||null};
    const saved = await dbIns('recurring_items', [row]);
    items.push(saved && saved[0] ? saved[0] : row);
    items.sort((a,b) => nextDue(a) - nextDue(b));
    document.getElementById('fd').value = '';
    document.getElementById('fa').value = '';
    render();
    ss('ok','✓ Synced');
  } catch(e) { ss('err','✗ Sync error'); console.error(e); }
}
async function del(id){ss('busy','⟳ Saving...');try{await dbDel('recurring_items',`id=eq.${id}`);items=items.filter(i=>i.id!==id);render();ss('ok','✓ Synced');}catch(e){ss('err','✗ Sync error');console.error(e);}}
function setFilter(f,el){af=f;document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderList();}
function renderSummary(){const today=new Date();today.setHours(0,0,0,0);const in7=new Date(today);in7.setDate(today.getDate()+7);const in30=new Date(today);in30.setDate(today.getDate()+30);document.getElementById('sm').textContent=fmt(items.reduce((s,i)=>s+monthlyAmt(i),0));document.getElementById('sw').textContent=fmt(items.filter(i=>nextDue(i)<=in7).reduce((s,i)=>s+i.amt,0));document.getElementById('s30').textContent=fmt(items.filter(i=>nextDue(i)<=in30).reduce((s,i)=>s+i.amt,0));const urgent=items.map(i=>({...i,due:nextDue(i),days:daysUntil(nextDue(i))})).filter(i=>i.days<=7).sort((a,b)=>a.days-b.days);const db=document.getElementById('db');const dl=document.getElementById('dl');if(urgent.length){db.classList.add('on');dl.innerHTML=urgent.map(i=>`<li>${i.description} — ${i.days===0?'Today':i.days===1?'Tomorrow':'In '+i.days+' days'}<span>${fmt(i.amt)}</span></li>`).join('');}else{db.classList.remove('on');}}
const FC={Monthly:'fM',Weekly:'fW',Biweekly:'fB',Quarterly:'fQ',Annual:'fA'};
function renderList(){const list=document.getElementById('rl');const filtered=af==='All'?items:items.filter(i=>i.freq===af);if(!filtered.length){list.innerHTML='<div class="empty">No recurring expenses yet.</div>';return;}list.innerHTML=filtered.map(item=>{const due=nextDue(item);const days=daysUntil(due);const dc=days<=3?'urgent':days<=7?'soon':'';const dl=days===0?'Today':days===1?'Tomorrow':fmtDate(due);return`<div class="ri"><div class="rn">${item.description}</div><div><span class="rf ${FC[item.freq]||'fM'}">${item.freq}</span></div><div class="rd2 ${dc}">${dl}</div><div class="ra">${fmt(item.amt)}</div><button class="bd" onclick="del(${item.id})">✕</button></div>`;}).join('');}
function render(){renderSummary();renderList();}
async function init(){ss('busy','⟳ Connecting...');try{const data=await dbGet('recurring_items','order=id.asc');items=data||[];render();ss('ok','✓ Synced');}catch(e){ss('err','✗ Connection failed');console.error(e);}updateDueInput();document.getElementById('fa').addEventListener('keydown',e=>{if(e.key==='Enter')addItem();});document.getElementById('fd').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('fa').focus();});}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
